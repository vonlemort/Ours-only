<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fix 3 Notes</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
    #log { margin-top: 24px; font-size: 13px; line-height: 1.9; }
    .ok  { color: #27ae60; }
    .err { color: #e74c3c; }
    button { padding: 12px 24px; background: #ff6fa6; color: #fff; border: none;
             border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <h2>🔧 Fix 3 notes</h2>
  <button id="runBtn">Run fix</button>
  <div id="log"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7Rt9RFyk6DHsaqB_2KIv0QBGPGXYrWPo",
      authDomain: "notes-8d314.firebaseapp.com",
      databaseURL: "https://notes-8d314-default-rtdb.firebaseio.com",
      projectId: "notes-8d314",
      storageBucket: "notes-8d314.firebasestorage.app",
      messagingSenderId: "46616929171",
      appId: "1:46616929171:web:c3981641b271d3e33b3e66"
    };
    firebase.initializeApp(firebaseConfig);
    firebase.auth().signInAnonymously();
    const db = firebase.database();
    const ROOM = 'for-khadeja';

    const fixes = [
      { key: '-OgSjkSuQE6IvCclVSYM', sender: 'Saleh'   }, // "I love you Khadeja :("
      { key: '-OgSlLRVndMX1KigUgqR',  sender: 'Saleh'   }, // "i love you"
      { key: '-OoofOzQSaJWMMWF6rfK',  sender: 'Khadeja' }, // "I miss u"
    ];

    const log = document.getElementById('log');
    const btn = document.getElementById('runBtn');

    function line(msg, cls) {
      const d = document.createElement('div');
      d.className = cls || '';
      d.textContent = msg;
      log.appendChild(d);
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      for (const { key, sender } of fixes) {
        try {
          await db.ref(`rooms/${ROOM}/notes/${key}/sender`).set(sender);
          line(`✓ ${key} → ${sender}`, 'ok');
        } catch(e) {
          line(`✗ ${key} FAILED: ${e.message}`, 'err');
        }
      }
      line('Done 💞', 'ok');
    });
  </script>
</body>
</html>
